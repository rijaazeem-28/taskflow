<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div class="brand">
          <span class="logo" aria-hidden="true">✓</span>
          <div>
            <h1>TaskFlow</h1>
            <p>Quick capture</p>
          </div>
        </div>
        <button type="button" class="link" id="open-options" title="Options" aria-label="Options">⚙</button>
      </header>

      <section id="setup" class="card hidden">
        <p class="muted">
          Connect once: open TaskFlow → Settings → generate a Chrome token, then paste it in
          Options.
        </p>
        <div class="row">
          <a class="btn secondary" id="open-app" href="#" target="_blank" rel="noreferrer">Open TaskFlow</a>
          <button type="button" class="btn" id="open-options-2">Open Options</button>
        </div>
      </section>

      <section id="main" class="hidden">
        <form id="create-form" class="card">
          <label for="title">New task</label>
          <input id="title" name="title" maxlength="200" placeholder="What needs doing?" required />
          <textarea
            id="description"
            name="description"
            rows="2"
            maxlength="2000"
            placeholder="Optional notes"
          ></textarea>
          <div class="row">
            <select id="priority" name="priority" aria-label="Priority">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
              <option value="URGENT">Urgent</option>
            </select>
            <button class="btn" type="submit" id="submit-btn">Add task</button>
          </div>
          <p id="form-status" class="status" role="status"></p>
        </form>

        <section class="card">
          <div class="row between">
            <h2>Recent tasks</h2>
            <button type="button" class="text-btn" id="refresh-btn">Refresh</button>
          </div>
          <p id="pending-line" class="muted"></p>
          <ul id="task-list" class="task-list"></ul>
        </section>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
