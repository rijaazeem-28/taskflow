[package]
name = "taskflow-desktop"
version = "1.0.0"
description = "Minimal TaskFlow desktop shell"
authors = ["TaskFlow"]
edition = "2021"

[lib]
name = "taskflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
